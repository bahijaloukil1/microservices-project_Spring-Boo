apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      imagePullSecrets:
        - name: nexus-secret
      containers:
        - name: eureka-server
          image: 100.93.99.105:8082/eureka-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
